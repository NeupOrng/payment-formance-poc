name: mobilebank

volumes:
  postgres-data: {}
  profile-node-modules: {}
  payment-node-modules: {}
  client-node-modules: {}
  temporal-data: {}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `task env` to create architecture/.env}
      # Passed to postgres/init.sh, which creates one role + database per service on first start.
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?run `task env`}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:?run `task env`}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?run `task env`}
    command: ["-c", "max_connections=200"]
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ledger:
    image: ghcr.io/formancehq/ledger:${LEDGER_VERSION:-v2.4.15}
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LEDGER_PORT:-3068}:3068"
    environment:
      POSTGRES_URI: postgresql://ledger:${LEDGER_DB_PASSWORD}@postgres:5432/ledger?sslmode=disable
      POSTGRES_MAX_OPEN_CONNS: "40"
      POSTGRES_MAX_IDLE_CONNS: "40"
      AUTO_UPGRADE: "true"
      EXPERIMENTAL_FEATURES: "true"
      # Every committed / reverted transaction is POSTed to the profile service, which mirrors
      # stock balances (ledger_balance, hold_amount) from the ledger.
      PUBLISHER_HTTP_ENABLED: "true"
      PUBLISHER_TOPIC_MAPPING: "*:http://profile-service:3000/ledger-events"
      BIND: ":3068"
    # The image has no HTTP client for a healthcheck; the payment service retries until the ledger answers.

  ledger-worker:
    image: ghcr.io/formancehq/ledger:${LEDGER_VERSION:-v2.4.15}
    command: ["worker"]
    depends_on:
      ledger:
        condition: service_started
    environment:
      POSTGRES_URI: postgresql://ledger:${LEDGER_DB_PASSWORD}@postgres:5432/ledger?sslmode=disable

  # Temporal dev server (SQLite persisted in a volume) with its web UI on :8233.
  temporal:
    image: temporalio/temporal:${TEMPORAL_CLI_VERSION:-1.9.1}
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporal-data:/home/temporal

  # Mock biller that confirms (or rejects) payments in the saga's partner step.
  partner-mock:
    build: ../partner-mock
    ports:
      - "${PARTNER_PORT:-4003}:3000"
    volumes:
      - ../partner-mock/server.mjs:/app/server.mjs:ro

  profile-service:
    build:
      context: ../profile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PROFILE_PORT:-4001}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://profile_svc:${PROFILE_DB_PASSWORD}@postgres:5432/profile
      LEDGER_URL: http://ledger:3068
      LEDGER_NAME: mobilebank
    volumes:
      - ../profile:/app
      - profile-node-modules:/app/node_modules

  payment-service:
    build:
      context: ../payment
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      ledger:
        condition: service_started
      profile-service:
        condition: service_started
      temporal:
        condition: service_started
      partner-mock:
        condition: service_started
    ports:
      - "${PAYMENT_PORT:-4002}:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://payment_svc:${PAYMENT_DB_PASSWORD}@postgres:5432/payment
      PROFILE_SERVICE_URL: http://profile-service:3000
      LEDGER_URL: http://ledger:3068
      LEDGER_NAME: mobilebank
      TEMPORAL_ADDRESS: temporal:7233
      SAGA_WAIT_MS: "5000"
      AUTH_TIMEOUT_SECONDS: "300"
    volumes:
      - ../payment:/app
      - payment-node-modules:/app/node_modules

  client:
    build:
      context: ../client
      target: dev
    depends_on:
      - profile-service
      - payment-service
    ports:
      - "${CLIENT_PORT:-4000}:3000"
    environment:
      NUXT_PROFILE_SERVICE_URL: http://profile-service:3000
      NUXT_PAYMENT_SERVICE_URL: http://payment-service:3000
    volumes:
      - ../client:/app
      - client-node-modules:/app/node_modules
